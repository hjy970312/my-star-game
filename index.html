<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接星星游戏</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div id="score-container">
                <div id="score">0</div>
                <div id="high-score">最佳: 0</div>
            </div>
            <div id="level">等级: 1</div>
            <div id="lives">3</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="mode-overlay" class="overlay">
            <h1>选择游戏模式</h1>
            <div id="user-info">
                <span id="player-name-display">玩家昵称: 未设置</span>
                <button id="edit-name-btn" class="icon-btn">✏️</button>
            </div>
            <div class="mode-buttons">
                <button class="mode-btn" data-mode="star">⭐ 经典星星局</button>
                <button class="mode-btn" data-mode="flower">🌸 鲜花局</button>
                <button class="mode-btn" data-mode="fruit">🍎 水果局</button>
                <button id="view-leaderboard-btn" class="secondary-btn">🏆 查看排行榜</button>
            </div>
        </div>
        <!-- 昵称设置弹窗 -->
        <div id="name-modal" class="overlay hidden">
            <div class="modal-content">
                <h2>设置你的昵称</h2>
                <input type="text" id="nickname-input" placeholder="输入你的大名..." maxlength="10">
                <button id="save-name-btn" class="mode-btn" style="margin-top: 20px;">确定</button>
            </div>
        </div>
        <!-- 主页排行榜弹窗 -->
        <div id="leaderboard-modal" class="overlay hidden">
            <div class="modal-content">
                <h2>🏆 历史最高得分</h2>
                <div class="leaderboard-tabs">
                    <button class="tab-btn active" data-tab="star">⭐ 星星</button>
                    <button class="tab-btn" data-tab="flower">🌸 鲜花</button>
                    <button class="tab-btn" data-tab="fruit">🍎 水果</button>
                </div>
                <div id="main-leaderboard-content">
                    <ul id="main-score-list"></ul>
                </div>
                <button id="close-leaderboard-btn" class="secondary-btn">返回主页</button>
            </div>
        </div>
        <div id="overlay" class="overlay hidden">
            <h1 id="overlay-title">游戏结束</h1>
            <p id="final-score">最终得分: 0</p>
            
            <div id="leaderboard">
                <h3>🏆 历史排行榜 (Top 10)</h3>
                <ul id="score-list">
                    <!-- 分数将通过 JS 动态插入 -->
                </ul>
            </div>

            <div class="end-buttons">
                <button id="restart-btn">重新开始</button>
                <button id="back-to-home-btn" class="secondary-btn">返回主页</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="game.js?v=10"></script>
</body>
</html>
